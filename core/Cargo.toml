[package]
name = "pc-cleaner-core"
description = "pc-cleaner のロジック本体（UI 非依存）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# 走査（#5）は std のみで実装したため追加依存なし
# （thread::scope / mpsc / fs::read_dir）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 重複ファイル検出（C2 / Issue #48）の内容ハッシュ用。情報提供のみに使う
# 非暗号学的ハッシュであり、推移的依存が無い軽量なものを選んだ。
twox-hash = "2"

[target.'cfg(windows)'.dependencies]
# ゴミ箱送り・一覧・復元（D3 / Issue #53）の実装。default features の
# "chrono" は Linux/Unix（非 macOS）向け os_limited 実装専用のオプション
# 依存であり、Windows では使われない。os_limited（list/restore_all/
# metadata）自体は target_os のみでゲートされ、feature の追加なしで
# Windows から利用できる（D3 実装時に trash-rs のソースを確認済み）。
# よってここでデフォルト機能を落としたままで問題ない。
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }
# 権限昇格（A2 / Issue #41）。必要な feature だけを明示的に有効化する。
# - Win32_UI_Shell        : ShellExecuteExW / SHELLEXECUTEINFOW / SEE_MASK_*
# - Win32_System_Registry : SHELLEXECUTEINFOW が hkeyClass: HKEY を持つため必須
#                           （単体では欠落エラーになる）。レジストリ操作自体は行わない。
# - Win32_Security        : GetTokenInformation / TokenElevation / TOKEN_QUERY
# - Win32_System_Threading: GetCurrentProcess / OpenProcessToken
# - Win32_Foundation      : HANDLE / CloseHandle / ERROR_CANCELLED
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
