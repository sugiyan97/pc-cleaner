[package]
name = "pc-cleaner-core"
description = "pc-cleaner のロジック本体（UI 非依存）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# 走査（#5）は std のみで実装したため追加依存なし
# （thread::scope / mpsc / fs::read_dir）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# ゴミ箱送りの実装。default features には os_limited 用の chrono が含まれるが
# 初版では trash::delete しか使わないため落とす（D3 で戻す想定）。
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }

[dev-dependencies]
tempfile = "3"
